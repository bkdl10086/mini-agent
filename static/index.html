<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #334155; display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; }

header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; }
header h1 { font-size: 17px; font-weight: 600; color: #3b82f6; }

#chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

.msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.7; word-break: break-word; font-size: 15px; }
.msg.user { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: #fff; color: #334155; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
.msg.tool { align-self: flex-start; background: #f0f9ff; color: #64748b; font-size: 13px; border-left: 3px solid #3b82f6; padding: 8px 12px; border-radius: 6px; }

#input-area { padding: 14px 20px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
#input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-size: 15px; outline: none; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; }
#input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
#send { padding: 10px 22px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .2s; }
#send:hover { background: #2563eb; }
#send:disabled { background: #94a3b8; cursor: not-allowed; }

.typing::after { content: "|"; animation: blink 1s infinite; color: #3b82f6; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body>

<header><h1>Mini Agent</h1></header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="input" placeholder="输入消息，Enter 发送..." rows="1"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let messages = [];

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  addMsg('user', text);
  messages.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  let agentDiv = addMsg('agent', '');
  agentDiv.classList.add('typing');

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullReply = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'tool') {
            agentDiv.classList.remove('typing');
            addMsg('tool', `${data.name}: ${data.preview}`);
            agentDiv = addMsg('agent', '');
            agentDiv.classList.add('typing');
          } else if (data.type === 'text') {
            agentDiv.classList.remove('typing');
            fullReply += data.content;
            agentDiv.textContent = fullReply;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (e) {}
      }
    }

    if (fullReply) messages.push({ role: 'assistant', content: fullReply });
    agentDiv.classList.remove('typing');
  } catch (err) {
    agentDiv.classList.remove('typing');
    agentDiv.textContent = '连接失败，请确认后端已启动';
  }

  sendBtn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', send);
</script>
</body>
</html>
